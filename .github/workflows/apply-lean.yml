name: Apply verified lean implementation
on:
  push:
    branches: ['jvo/lean-decisions']
    paths: ['.maintenance/**', '.github/workflows/apply-lean.yml']
permissions:
  contents: write
concurrency:
  group: apply-lean-implementation
  cancel-in-progress: false
jobs:
  apply:
    if: github.repository == 'moto-taka/jev-orchestrator' && github.ref == 'refs/heads/jvo/lean-decisions'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply only the byte-verified implementation to the expected source
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code edfd435e7b2e08383b641435137dee3fccc803e4 HEAD -- . ':(exclude).maintenance/**' ':(exclude).github/workflows/apply-lean.yml'
          echo 'cbb80a6c47e4056780f7a3c804b2a88c09cdf66193f8b563b8fb8bab4df45bef  .maintenance/engine.patch' | sha256sum -c -
          echo '62d190d39189b2f34013a0abca3254a5342d4225bcae2317f7b40c7d09b1c009  .maintenance/core.patch' | sha256sum -c -
          echo '579e20b9d09ec9e1e321e5eb2dcbdfe3ff3b5b913ee6497076c555be02ae578b  .maintenance/docs.patch' | sha256sum -c -
          git apply --check --index --unidiff-zero .maintenance/engine.patch .maintenance/core.patch .maintenance/docs.patch
          git apply --index --unidiff-zero .maintenance/engine.patch .maintenance/core.patch .maintenance/docs.patch
          git rm .maintenance/engine.patch .maintenance/core.patch .maintenance/docs.patch .github/workflows/apply-lean.yml
          test "$(git write-tree)" = '3e99ef4bdb955eebaaac16192183d2e540acab9d'
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npm run check
      - run: node bin/jvo.mjs demo --json
      - run: npm run test:package
      - name: Commit the verified source to this branch only
        shell: bash
        run: |
          set -euo pipefail
          test "$(git write-tree)" = '3e99ef4bdb955eebaaac16192183d2e540acab9d'
          git diff --exit-code
          test "$(git ls-remote origin refs/heads/jvo/lean-decisions | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Implement jvo 0.3.0 lean decisions and optional report triage' -m 'Apply the exact locally verified tree 3e99ef4bdb955eebaaac16192183d2e540acab9d. Preserve actual Jev decision provenance, runtime guards, independent reviews, final tests, and legacy-run policy. Tests and offline package verification ran before this commit. Remove this one-time maintenance workflow and patches.'
          git push origin HEAD:refs/heads/jvo/lean-decisions
          git rev-parse HEAD
          git rev-parse HEAD^{tree}
          mkdir -p "$RUNNER_TEMP/lean-source"
          git archive --format=tar.gz -o "$RUNNER_TEMP/lean-source/source.tar.gz" HEAD
          git rev-parse HEAD > "$RUNNER_TEMP/lean-source/source-commit.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: verified-lean-source
          path: ${{ runner.temp }}/lean-source/
          retention-days: 7
