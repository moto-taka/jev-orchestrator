name: verify
on:
  push:
    branches: [main, 'jvo/lean-decisions']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Archive only tracked source for reproducible verification
        run: |
          git archive --format=tar.gz -o source.tar.gz HEAD
          git rev-parse HEAD > source-commit.txt
      - uses: actions/upload-artifact@v4
        with:
          name: source-${{ github.sha }}
          path: |
            source.tar.gz
            source-commit.txt
          retention-days: 7
  check:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: '22.16.0'
          - os: ubuntu-latest
            node: '24'
          - os: macos-latest
            node: '22.16.0'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npm run check
      - run: node bin/jvo.mjs demo --json
      - run: npm run test:package
